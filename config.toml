# Configuration du scanner. Modifiez librement.

[capital]
montant = 3000           # part « satellite » (30 %) dédiée aux signaux ; le reste est placé sur un ETF gardé
risque_par_trade = 0.01  # 1 % du capital risqué par trade
frais_bps = 5            # frais + slippage par ordre, en points de base (0,05 %)
ratio_min = 3.0          # seuls les signaux avec un ratio gain/perte d'au moins 3 pour 1 sont envoyés

# Protection du capital
[filtres]
filtre_marche = true            # achats seulement si le S&P 500 est au-dessus de sa moyenne 200 jours, ventes seulement en dessous
max_positions = 4               # nombre maximum de positions ouvertes ou en attente (une seule par actif)
jours_avant_resultats = 5       # pas d'achat d'action dans les 5 jours de bourse avant ses résultats
stop_a_l_entree_apres_r = 1.0   # stop ramené au prix d'entrée dès que le gain atteint 1 fois le risque

# Spéculation : actions leaders du moment, en actions réelles sur eToro (voir reports/speculation.md)
# Répartition proposée d'un capital de 10 000 € : 6 000 € ETF gardé, 3 000 € signaux swing, 1 000 € spéculation.
[speculation]
capital = 1000
nombre = 5               # nombre d'actions détenues
jours = 126              # force relative mesurée sur 6 mois de bourse
filtre_marche = true     # tout vendre quand le S&P 500 passe sous sa moyenne 200 jours

