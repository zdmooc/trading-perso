# Déclencheurs à l'heure exacte (heure de Paris) depuis CRC : chaque CronJob demande à GitHub
# de lancer un workflow du dépôt zdmooc/trading-perso. Aucun ordre de bourse, aucun accès IG ici.
# Le jeton GitHub vit dans le secret « github-dispatch » (créé à la main, jamais dans ce fichier).
apiVersion: v1
kind: List
items:
- apiVersion: batch/v1
  kind: CronJob
  metadata:
    name: plan-8h45
    namespace: trading-perso
  spec:
    schedule: "45 8 * * 1-5"
    timeZone: Europe/Paris
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 600
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 2
    jobTemplate:
      spec:
        backoffLimit: 2
        activeDeadlineSeconds: 120
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: declencheur
              image: registry.access.redhat.com/ubi9/ubi-minimal:latest
              env:
              - name: GH_TOKEN
                valueFrom: {secretKeyRef: {name: github-dispatch, key: token}}
              command: ["sh", "-c"]
              args:
              - >-
                curl -fsS -X POST
                -H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json"
                https://api.github.com/repos/zdmooc/trading-perso/actions/workflows/plan.yml/dispatches
                -d '{"ref":"main","inputs":{"phase":"plan"}}'
                && echo "plan.yml lancé"
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {cpu: 100m, memory: 64Mi}
