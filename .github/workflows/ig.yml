name: ig-demo
# Compte IG démo en lecture seule : aucun ordre n'est jamais passé.
on:
  schedule:
    # Relevés silencieux, heure de Paris en été (une heure plus tôt en hiver) :
    # 7h10, 9h20, 12h, 15h50, 17h55, 22h20 en semaine ; midi le week-end pour les cryptos.
    - cron: "10 5 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "0 10 * * *"
    - cron: "50 13 * * 1-5"
    - cron: "55 15 * * 1-5"
    - cron: "20 20 * * 1-5"
  workflow_dispatch:
    inputs:
      commande:
        type: choice
        options: [ig-marches, ig-test]
        default: ig-marches
      silencieux:
        description: "pas de message Telegram"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: releve-ig
  cancel-in-progress: false
jobs:
  ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Lecture IG démo
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
          IG_ACCOUNT_ID: Z4UJIM
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: tradeperso ${{ inputs.commande || 'ig-marches' }} ${{ (github.event_name == 'schedule' || format('{0}', inputs.silencieux) == 'true') && '--silencieux' || '' }}
      - name: Publier
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Relevé IG du $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
