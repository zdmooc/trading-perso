name: ig-demo
# Connexion au compte IG démo (test, sans ordre).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rapports
  cancel-in-progress: false
jobs:
  ig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Test IG démo
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: tradeperso ig-test
      - name: Publier
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Test IG démo du $(date -u +%F)"
          git pull -q --rebase origin main
          git push
