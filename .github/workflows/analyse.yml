name: analyse-europe
# Analyse de fond du marché européen, à la demande.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rapports
  cancel-in-progress: false
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . tabulate
      - run: python scripts/analyse_europe.py
      - name: Publier
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Analyse Europe du $(date -u +%F)"
          git pull -q --rebase origin main
          git push
