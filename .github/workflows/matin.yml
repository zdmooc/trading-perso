name: plan-europe
# Plan Europe à 7h, niveaux après la 1re heure vers 10h05, bilan à 17h45 (heure de Paris).
# GitHub est en heure UTC : deux horaires par phase (été / hiver), le script ne garde que le bon.
on:
  schedule:
    - cron: "0 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "5 8 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "45 15 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "matin, ouverture ou bilan"
        default: matin
permissions:
  contents: write
concurrency:
  group: rapports
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Plan Europe
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tradeperso matin --phase "${{ inputs.phase }}"
          else
            tradeperso matin --cron "${{ github.event.schedule }}"
          fi
      - name: Publier les rapports
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Plan Europe du $(date -u +%F)"
          git pull -q --rebase origin main
          git push
