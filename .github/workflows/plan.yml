name: plan-du-jour
# Plan du jour DAX / Nasdaq 100 / S&P 500 en cours IG (lecture seule, aucun ordre).
# 8h45 plan, 14h15 point, 17h45 bilan (heure de Paris). Deux horaires UTC par phase (été / hiver).
on:
  schedule:
    - cron: "45 6 * * 1-5"
    - cron: "45 7 * * 1-5"
    - cron: "15 12 * * 1-5"
    - cron: "15 13 * * 1-5"
    - cron: "45 15 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [plan, point, bilan]
        default: plan
      silencieux:
        description: "pas de message Telegram"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: plan-du-jour
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Plan du jour
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_ACC_TYPE: ${{ secrets.IG_ACC_TYPE }}
          IG_ACCOUNT_ID: Z4UJIM
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tradeperso plan --phase "${{ inputs.phase }}" ${{ inputs.silencieux && '--silencieux' || '' }}
          else
            tradeperso plan --cron "${{ github.event.schedule }}"
          fi
      - name: Publier
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "Plan du jour $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase origin main && git push && break; sleep 5; done
